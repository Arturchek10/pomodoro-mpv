services:
  postgres:
    image: postgres:16-bookworm #образ программы
    platform: linux/amd64
    # container_name: postgres #контейнер (запущенный экземпляр образа)

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # POSTGRES_DB: pomodoro3.0
      POSTGRES_DB: pomodoro

    ports:
      - "5432:5432" # порт postgresql внутри контейнера работает на порту 5432.
      #Чтобы подключаться к нему с windows, порт контейнера связывается с портом  компьютера

    volumes:
      - postgres_data:/var/lib/postgresql/data # файл где будет хранится вся инфа образа (volumes)

    restart: unless-stopped # перезапуск только если не остановили сами.

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: pomodoro-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
